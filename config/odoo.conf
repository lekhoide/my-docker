[options]

; ==============================================================================
; COMMON OPTIONS
; ==============================================================================

; [BẮT BUỘC] Đường dẫn đến file config (chỉ dùng trên CLI, không load từ file)
; Env: ODOO_RC
; config = ~/.odoorc

; Cài đặt một hoặc nhiều module khi khởi động (chỉ dùng trên CLI)
; Yêu cầu -d/--database. Dùng "all" để cài tất cả
; Default: (rỗng)
init = base

; Cập nhật một hoặc nhiều module (chỉ dùng trên CLI)
; Yêu cầu -d/--database. Dùng "all" để cập nhật tất cả
; Default: (rỗng)
; update =

; Kích hoạt cài đặt dữ liệu demo khi tạo database mới
; Default: False
with_demo = False

; Bỏ qua việc tự động cài module được đánh dấu auto_install
; Default: False
skip_auto_install = False

; File lưu trạng thái trung gian khi import dữ liệu lớn (chỉ dùng CLI)
; Default: (rỗng)
; import_partial =

; File lưu PID của server khi chạy
; Default: (rỗng)
; pidfile =

; [BẮT BUỘC nếu dùng custom module] Đường dẫn đến thư mục addons (phân cách bằng dấu phẩy)
; Hỗ trợ wildcard glob (vd: /opt/odoo/addons/*)
; Default: (rỗng)
addons_path =   /opt/odoo19/workspaces/odoo/odoo/addons,
                /opt/odoo19/workspaces/odoo/addons,
                /opt/odoo19/workspaces/extra-addons

; Đường dẫn đến thư mục chứa upgrade scripts
; Default: (rỗng)
; upgrade_path =

; Các script chạy trước khi nâng cấp module (khi dùng -u)
; Default: (rỗng)
; pre_upgrade_scripts =

; Danh sách các server-wide modules (phân cách bằng dấu phẩy)
; Default: base,rpc,web  |  Bắt buộc phải có: base,web
server_wide_modules = base,rpc,web

; Thư mục lưu trữ dữ liệu Odoo (sessions, filestore, addons)
; Default (Linux): /var/lib/odoo | Default (user home): ~/.local/share/Odoo
data_dir = /opt/odoo19/data


; ==============================================================================
; HTTP SERVICE CONFIGURATION
; ==============================================================================

; Địa chỉ interface lắng nghe HTTP
; Default: 0.0.0.0 (tất cả interface) — sẽ đổi thành 127.0.0.1 trong v20.0
http_interface = 0.0.0.0

; Cổng lắng nghe HTTP chính
; Default: 8069
http_port = 8069

; Cổng lắng nghe cho gevent worker (longpolling/websocket)
; Default: 8072
gevent_port = 8072

; Tắt hoàn toàn HTTP và Longpolling service
; Default: True (bật HTTP)
http_enable = True

; Kích hoạt WSGI reverse proxy wrappers (rewrite headers)
; Chỉ bật khi chạy sau một trusted reverse proxy (nginx/apache)
; Default: False
proxy_mode = False

; Kích hoạt X-Sendfile (Apache) / X-Accel-Redirect (Nginx)
; Ủy thác việc phục vụ file lớn (assets/attachments) cho web server
; Default: False
x_sendfile = False


; ==============================================================================
; WEB INTERFACE CONFIGURATION
; ==============================================================================

; Regex lọc danh sách database hiển thị trên Web UI
; Hỗ trợ placeholder: %d (domain), %h (host)
; Default: (rỗng = hiển thị tất cả)
; dbfilter = ^%d$


; ==============================================================================
; LOGGING CONFIGURATION
; ==============================================================================

; File lưu log của server
; Default: (rỗng = log ra stdout)
; logfile = /var/log/odoo/odoo.log

; Gửi log đến syslog server (không dùng chung với logfile)
; Default: False
syslog = False

; Thiết lập log handler theo định dạng MODULE:LEVEL
; MODULE rỗng = root logger. Có thể khai báo nhiều dòng.
; Ví dụ: odoo.orm:DEBUG | werkzeug:CRITICAL
; Default: :INFO
log_handler = :INFO

; Database nhận log (nếu muốn ghi log vào DB)
; Default: (rỗng)
; log_db =

; Mức log ghi vào database
; Default: warning
log_db_level = warning

; Mức log toàn cục
; Các giá trị hợp lệ: info, debug_rpc, warn, test, critical, runbot,
;                      debug_sql, error, debug, debug_rpc_answer, notset
; Default: info
log_level = info


; ==============================================================================
; SMTP CONFIGURATION
; ==============================================================================

; Địa chỉ email dùng để gửi mail (From header)
; Default: (rỗng)
; email_from =

; Chỉ định địa chỉ email nào được phép dùng SMTP này
; Default: (rỗng)
; from_filter =

; Địa chỉ SMTP server
; Default: localhost
smtp_server = localhost

; Cổng SMTP
; Default: 25
smtp_port = 25

; Bật mã hóa SSL/STARTTLS cho kết nối SMTP
; Default: False
smtp_ssl = False

; Username SMTP
; Default: (rỗng)
; smtp_user =

; Password SMTP
; Default: (rỗng)
; smtp_password =

; Đường dẫn đến SSL certificate dùng cho xác thực SMTP
; Default: (rỗng)
; smtp_ssl_certificate_filename =

; Đường dẫn đến SSL private key dùng cho xác thực SMTP
; Default: (rỗng)
; smtp_ssl_private_key_filename =


; ==============================================================================
; DATABASE CONFIGURATION
; ==============================================================================

; [BẮT BUỘC khi dùng -i/-u] Tên database (phân cách bằng dấu phẩy nếu nhiều DB)
; Env: PGDATABASE
; Default: (rỗng)
db_name = m6419

; Username kết nối PostgreSQL
; Env: PGUSER
; Default: (rỗng = dùng user hệ thống)
db_user = odoo

; Password kết nối PostgreSQL
; Env: PGPASSWORD
; Default: (rỗng)
db_password = odoo

; Đường dẫn đến các lệnh thực thi PostgreSQL (pg_dump, pg_restore,...)
; Env: PGPATH
; Default: (rỗng = tìm trong PATH)
; pg_path =

; Host của PostgreSQL server
; Env: PGHOST
; Default: (rỗng = dùng Unix socket)
db_host = postgres15

; Host của PostgreSQL replica (dùng cho read replica)
; Env: PGHOST_REPLICA
; Default: None
; db_replica_host =

; Cổng kết nối PostgreSQL
; Env: PGPORT
; Default: None (mặc định 5432)
db_port = 5432

; Cổng kết nối PostgreSQL replica
; Env: PGPORT_REPLICA
; Default: None
; db_replica_port =

; Chế độ SSL kết nối PostgreSQL
; Giá trị hợp lệ: disable, allow, prefer, require, verify-ca, verify-full
; Env: PGSSLMODE
; Default: prefer
db_sslmode = prefer

; Tên hiển thị của ứng dụng trong PostgreSQL (pg_stat_activity)
; {pid} sẽ được thay bằng process ID thực tế
; Env: PGAPPNAME
; Default: odoo-{pid}
db_app_name = odoo-{pid}

; Số kết nối vật lý tối đa đến PostgreSQL
; Default: 64
db_maxconn = 64

; Số kết nối vật lý tối đa đến PostgreSQL dành riêng cho gevent worker
; Default: None (dùng chung db_maxconn)
; db_maxconn_gevent =

; Template database dùng khi tạo database mới
; Env: PGDATABASE_TEMPLATE
; Default: template0
db_template = template0


; ==============================================================================
; SECURITY OPTIONS
; ==============================================================================

; Mật khẩu super-admin (quản lý database từ /web/database/manager)
; Nên đặt giá trị mạnh, tránh dùng 'admin' mặc định
; Default: admin
admin_passwd = odoo

; Tắt khả năng liệt kê và xem danh sách database (bao gồm database manager)
; Khuyến nghị bật (False) trên môi trường production
; Nếu tắt, cần đảm bảo db_name đã được cấu hình đúng
; Default: True (cho phép liệt kê)
list_db = True


; ==============================================================================
; ADVANCED OPTIONS
; ==============================================================================

; Kích hoạt các tính năng dành cho developer (phân cách bằng dấu phẩy)
; Env: ODOO_DEV
; Giá trị hợp lệ: access, qweb, reload, xml, replica, werkzeug
;   - access  : log traceback của access errors
;   - qweb    : log compiled XML khi có lỗi QWeb
;   - reload  : tự restart server khi source code thay đổi
;   - replica  : giả lập môi trường có read-only replica
;   - werkzeug: mở HTML debugger khi có lỗi HTTP request
;   - xml     : đọc views từ source code thay vì database
;   - all     : kích hoạt tất cả (access,reload,qweb,xml)
; Default: (rỗng)
;dev_mode = reload,xml

; Giới hạn số record tối đa trong các bảng osv_memory (virtual/transient)
; 0 = không giới hạn
; Default: 0
osv_memory_count_limit = 0

; Thời gian tối đa (giờ) giữ record của TransientModel (wizard) trong DB
; Default: 1.0
transient_age_limit = 1.0

; Số thread xử lý cron job đồng thời tối đa
; Default: 2
max_cron_threads = 2

; Thời gian tối đa (giây) một cron thread/worker tồn tại trước khi bị restart
; 0 = không giới hạn
; Default: 0
limit_time_worker_cron = 0

; Thử kích hoạt extension "unaccent" của PostgreSQL khi tạo database mới
; Giúp tìm kiếm không phân biệt dấu (ví dụ: "cafe" tìm ra "café")
; Default: False
unaccent = False

; Đường dẫn tuyệt đối đến file GeoIP City database (MaxMind mmdb)
; Default: /usr/share/GeoIP/GeoLite2-City.mmdb
geoip_city_db = /usr/share/GeoIP/GeoLite2-City.mmdb

; Đường dẫn tuyệt đối đến file GeoIP Country database (MaxMind mmdb)
; Default: /usr/share/GeoIP/GeoLite2-Country.mmdb
geoip_country_db = /usr/share/GeoIP/GeoLite2-Country.mmdb


; ==============================================================================
; MULTIPROCESSING OPTIONS (chỉ áp dụng trên Linux/POSIX)
; ==============================================================================

; Số lượng worker processes
; 0 = tắt prefork mode, chạy single-threaded
; Default: 0
workers = 0

; Bộ nhớ ảo tối đa cho mỗi worker (bytes)
; Khi vượt ngưỡng, worker sẽ được reset sau request hiện tại
; Default: 2147483648 (2048 MiB)
limit_memory_soft = 2147483648

; Bộ nhớ ảo tối đa cho mỗi gevent worker (bytes)
; Default: None (dùng chung limit_memory_soft)
; limit_memory_soft_gevent =

; Bộ nhớ ảo tối đa tuyệt đối cho mỗi worker (bytes)
; Khi vượt ngưỡng, mọi thao tác cấp phát bộ nhớ sẽ thất bại
; Default: 2684354560 (2560 MiB)
limit_memory_hard = 2684354560

; Bộ nhớ ảo tối đa tuyệt đối cho mỗi gevent worker (bytes)
; Default: None (dùng chung limit_memory_hard)
; limit_memory_hard_gevent =

; Thời gian CPU tối đa cho mỗi request (giây) — chỉ POSIX
; Default: 60
limit_time_cpu = 60

; Thời gian thực tối đa cho mỗi request (giây)
; Default: 120
limit_time_real = 120

; Thời gian thực tối đa cho mỗi cron job (giây)
; -1 = dùng giá trị của limit_time_real | 0 = không giới hạn
; Default: -1
limit_time_real_cron = -1

; Số request tối đa mỗi worker xử lý trước khi được restart — chỉ POSIX
; Default: 65536
limit_request = 65536


; ==============================================================================
; WEBSOCKET CONFIGURATION (chỉ cấu hình qua file, không có CLI flag)
; ==============================================================================

; Thời gian timeout (giây) giữ kết nối WebSocket sống
; Default: 3600
websocket_keep_alive_timeout = 3600

; Số burst tối đa cho rate limiting WebSocket
; Default: 10
websocket_rate_limit_burst = 10

; Độ trễ (giây) giữa các request WebSocket khi bị rate limit
; Default: 0.2
websocket_rate_limit_delay = 0.2


; ==============================================================================
; FILE IMPORT CONFIGURATION (chỉ cấu hình qua file, không có CLI flag)
; ==============================================================================

; Kích thước tối đa (bytes) của file được import
; Default: 10485760 (10 MiB)
; import_file_maxbytes = 10485760

; Timeout (giây) khi fetch URL để import
; Default: 3
; import_file_timeout = 3

; Regex kiểm tra URL hợp lệ khi import từ URL
; Default: ^(?:http|https)://
; import_url_regex = ^(?:http|https)://


; ==============================================================================
; MISCELLANEOUS (chỉ cấu hình qua file)
; ==============================================================================

; Ký tự phân cách nội bộ cho CSV
; Default: ,
; csv_internal_sep = ,

; Bật nén gzip cho báo cáo
; Default: False
; reportgz = False